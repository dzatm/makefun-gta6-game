<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solmarina: Streets of Gold</title>
<style>
  html, body { margin: 0; padding: 0; background: #101018; height: 100%; overflow: hidden; }
  #game { display: block; width: 100vw; height: 100vh; cursor: crosshair; }
  #loading {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #ffd43b; font: bold 22px sans-serif; background: #101018; z-index: 5;
  }
</style>
</head>
<body>
<div id="loading">Loading Solmarina…</div>
<canvas id="game" width="1280" height="720"></canvas>
<script type="module">
  import { initGame } from './src/main.js';
  const canvas = document.getElementById('game');
  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();
  const G = initGame(canvas);
  document.getElementById('loading').remove();
  window.__game = G;
</script>
</body>
</html>
